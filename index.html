<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2d5a45" />
  <meta name="description" content="Deutschheft — 我的德语练习本" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Deutschheft" />
  <title>Deutschheft · 我的德语练习本</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">H</span>
      <div>
        <p class="brand-kicker">Mein Heft</p>
        <h1>Deutschheft</h1>
      </div>
    </div>
    <div class="topbar-right">
      <label class="level-switch">
        <span class="sr-only">学习等级</span>
        <select id="level-select" aria-label="切换 CEFR 等级"></select>
      </label>
      <button type="button" class="icon-btn" id="btn-speak-test" title="试听发音" aria-label="试听德语发音">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16.5 8.5a5 5 0 010 7"/></svg>
      </button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="dock" aria-label="主导航">
    <button type="button" data-route="home" class="dock-item is-active">
      <span class="dock-ico">今日</span>
      <span>首页</span>
    </button>
    <button type="button" data-route="cards" class="dock-item">
      <span class="dock-ico">词</span>
      <span>单词</span>
    </button>
    <button type="button" data-route="quiz" class="dock-item">
      <span class="dock-ico">测</span>
      <span>测验</span>
    </button>
    <button type="button" data-route="phrases" class="dock-item">
      <span class="dock-ico">句</span>
      <span>句子</span>
    </button>
    <button type="button" data-route="me" class="dock-item">
      <span class="dock-ico">我</span>
      <span>进度</span>
    </button>
  </nav>

  <div id="modal-root"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
